# 템플릿 블록. extents = 삽입점 (0,0), 배율 1, 회전 0 기준의 형상 범위(속성 정의 문자 제외, mm).
# scale: 삽입 배율(s = k/100). layer: 삽입할 때 현재 레이어로 둘 레이어(블록 참조가 들어갈 레이어).
# insert: "-INSERT"(속성값을 함께 넣는 명령 문자열) 또는 "insert_block"(MCP 툴).
# status: standard = 쓰는 블록, unused = 템플릿에 있지만 쓰지 않는 블록(reason에 이유).
blocks:
  - name: 축열버블-상
    status: standard
    layer: DIM
    scale: s
    insert: -INSERT
    attributes:
      - {tag: 축열, height: 225, layer: DIM}
    extents: [[-300, 350], [300, 1100]]
    note: 상부(세로 축선 X열) 버블. 삽입점 = 축 x, 가장 바깥 치수선 y
  - name: 축열버블-좌
    status: standard
    layer: DIM
    scale: s
    insert: -INSERT
    attributes:
      - {tag: 축열, height: 225, layer: DIM}
    extents: [[-1100, -300], [-350, 300]]
    note: 좌측(가로 축선 Y열) 버블. 삽입점 = 가장 바깥 치수선 x, 축 y
  - name: 계단화살표
    status: standard
    layer: DIM
    scale: s
    insert: insert_block
    extents: [[-152.5, -125.7], [152.5, 0]]
    note: 꼭짓점이 삽입점, +y를 가리킴. 회전으로 방향 지정
  - name: 계단절단선Z
    status: standard
    layer: SYM1
    scale: s
    insert: insert_block
    extents: [[-65.6, -110], [65.6, 110]]
    note: 30° 절단선의 Z 꺾임(stair.md)
  - name: HEOarchitects_sheet
    status: standard
    layer: TIT
    scale: s
    insert: insert_block
    extents: [[0, 0], [42000, 29700]]
    note: 도곽. 그림 영역은 좌하단 기준 (0,0)–(35000,29700) × s, 오른쪽 띠는 표제란
  - name: 방위
    status: standard
    layer: SYM1
    scale: s
    insert: insert_block
    extents: [[-1250, -1502.9], [1250, 1502.9]]
    note: 중심 기준
  - name: LEV
    status: standard
    layer: LEV
    scale: 0.5s
    insert: insert_block
    extents: [[0, 0], [2007.4, 400]]
    note: 평면 레벨 기호. 기호 중심 (200,200), 레벨선 y=200. 문자는 따로 넣는다
  - name: 입단면층레벨
    status: standard
    layer: LEV
    scale: 0.5s
    insert: -INSERT
    attributes:
      - {tag: SL-80, height: 270, layer: TIT}
      - {tag: FL%%P0, height: 270, layer: TIT}
    extents: [[-200, -200], [1645.5, 200]]
    note: 기호 중심이 삽입점. 속성 2개(선 아래 값 먼저, 선 위 값 나중). X·Y 배율이 같게 고정돼 Y 배율을 묻지 않는다. 속성 문자 포함 범위 (−200,−362)–(1645,369)
  - name: ARR2
    status: standard
    layer: SYM1
    scale: s
    insert: insert_block
    extents: [[0, 0], [2040.3, 1077.3]]
    note: 속이 빈 화살표, −x를 가리킴. 배치도 주출입구·차량 진입. 매뉴얼 사용 예가 없어 배율 s는 가정
  - name: ARR
