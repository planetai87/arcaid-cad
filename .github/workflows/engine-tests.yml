name: engine-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 엔진 의존성만 설치한다(D1: 엔진은 CAD·MCP 없이 돈다). tests/mcp, tests/cad는 Linux에서 스스로 빠진다
      - run: python -m pip install "ezdxf>=1.4,<2" "PyYAML>=6.0" "pydantic>=2.0" "Pillow>=10.0.0" "numpy>=1.24" "shapely>=2.0" "pytest>=8"
      - run: python -m pytest -q
      - name: CLI 파일 명령
        run: |
          python -m src.cli check standards/heo-2026/template.dxf --scale 100 --strict
          python -m src.cli build tests/engine/specs/dangsan_typical.json -o "$RUNNER_TEMP/d.dxf"
          python -m src.cli check "$RUNNER_TEMP/d.dxf" --strict
      - name: 저장소 밖에서 CLI 실행
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.cli check "$GITHUB_WORKSPACE/standards/heo-2026/template.dxf" --scale 100 --strict

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/mcp tests/cli tests/engine tests/ui -q
