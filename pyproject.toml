[project]
name = "arcaid-cad"
version = "3.0.0"
description = "arcaid-cad - MCP로 GstarCAD/BricsCAD/AutoCAD/ZWCAD를 조작해 그리기·조회·편집·도면 관리를 하는 서버"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.12,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "ezdxf>=1.4,<2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# 설치 후 arcaid-cad 명령으로 서버를 바로 실행할 수 있다
arcaid-cad = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 기존 src 폴더 구조를 유지해 python src/server.py 실행 방식과 호환한다
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
